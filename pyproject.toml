[project]
name = "rent_mp"
version = "0.1.0"
description = "Backend API for P2P/B2C Rental Marketplace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Веб-фреймворк и ASGI-сервер
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Настройки и валидация данных (Pydantic v2)
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    # Работа с базой данных (Async ORM)
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Безопасность и авторизация (JWT, Hashing)
    "pwdlib[argon2]>=0.2.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    # Кэширование и фоновые задачи (Redis)
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
dev = [
    # Линтинг и форматирование кода
    "ruff>=0.4.0",
    "mypy>=1.10.0",

    # Тестирование
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- НАСТРОЙКИ ИНСТРУМЕНТОВ КАЧЕСТВА КОДА ---

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (авто-сортировка импортов)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (предлагает синтаксис Python 3.12)
]
ignore = []

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "."
testpaths = ["tests"]

[dependency-groups]
dev = [
    "asyncio>=4.0.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
